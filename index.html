<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joy Go 圍棋題庫 Beta 0.5</title>
<style>
:root{--bg:#f4efe6;--panel:#fffdf8;--ink:#29251f;--brown:#765536;--line:#d9cbb8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#40352d;color:#fff;padding:14px 20px}header h1{font-size:21px;margin:0}header small{opacity:.8}
main{max-width:1280px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(520px,1.75fr) minmax(420px,1fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{margin:0 0 12px;font-size:19px}.row,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.field{display:flex;flex-direction:column;gap:4px;min-width:110px}label,.hint{font-size:13px;color:#70665d}
button,select,textarea{font:inherit;border:1px solid #bcae9d;border-radius:9px;padding:9px;background:white}button{font-weight:650}button.primary{background:var(--brown);color:#fff;border-color:var(--brown)}button.active{outline:3px solid #d5b185;background:#fff5e5}
#board{width:100%;max-width:650px;aspect-ratio:1;display:block;margin:10px auto;background:#d9aa62;border:1px solid #9b6a32;touch-action:none}
textarea{width:100%;min-height:70px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"thumb thumb thumb" "pick info del";gap:7px 8px;align-items:center;min-width:0}.card .thumb{grid-area:thumb}.card .pick{grid-area:pick}.card .info{grid-area:info;min-width:0}.card .danger{grid-area:del}.card strong{display:block;font-size:15px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:min(100%,190px);aspect-ratio:1;justify-self:center;display:block;background:#d9aa62;border:1px solid #c8b79f;border-radius:5px;cursor:pointer}.selected{outline:3px solid #9c744d}.meta{font-size:12px;color:#776b60}.badge{font-size:12px;background:#eee3d4;padding:3px 7px;border-radius:999px}.danger{color:#a4453e}
.printbar{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap}.answerHint{font-size:13px;color:#765536;font-weight:650}.answerBadge{color:#765536;font-weight:700}
@media(max-width:1050px){main{grid-template-columns:minmax(470px,1.45fr) minmax(390px,1fr);gap:12px}.thumb{width:min(100%,165px)}.card strong{font-size:14px}}@media(max-width:800px){main{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.thumb{width:min(100%,240px)}}
#printArea{display:none}
@media print{
 @page{size:A4 portrait;margin:8mm} body{background:white}header,main{display:none!important}#printArea{display:block!important}
 .sheet-title{text-align:center;font-weight:700;font-size:16pt}.sheet-sub{display:flex;justify-content:space-between;font-size:9pt;margin:2mm 0 3mm}
 .print-grid{display:grid;grid-template-columns:1fr 1fr;gap:3mm 5mm}.puzzle{break-inside:avoid}.phead{font-size:9pt;font-weight:700;margin-bottom:1mm}
 .print-grid.n4 .psvg{height:82mm}.print-grid.n6 .psvg{height:54mm}.print-grid.n10{gap:1.5mm 5mm}.print-grid.n10 .psvg{height:30mm}
 .psvg{width:100%;display:block}
}
#previewDlg{border:0;border-radius:14px;padding:12px;width:min(92vw,680px);background:#fffdf8}#previewDlg::backdrop{background:#0008}.previewTop,.previewNav{display:flex;justify-content:space-between;align-items:center;gap:8px}.previewNav{justify-content:center;margin-top:8px}#previewBoard{width:100%;aspect-ratio:1;display:block;background:#d9aa62}
.student-wrap{max-width:980px;margin:auto;padding:16px}
.student-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.student-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.student-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.student-card svg{width:100%;aspect-ratio:1;display:block;background:#d9aa62;border-radius:6px}
.student-info{font-weight:700;margin-top:8px}.student-meta{font-size:13px;color:#776b60;margin-top:3px}
@media(max-width:700px){.student-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Joy Go 圍棋題庫</h1><small>Beta 0.5a・棋盤標記版</small></header>
<main>
<section class="panel">
<h2>① 建立題目</h2>
<div class="row">
<div class="field"><label>棋盤</label><select id="size"><option>19</option><option>13</option><option>9</option></select></div>
<div class="field"><label>先手</label><select id="first"><option>黑先</option><option>白先</option></select></div>
<div class="field"><label>分類</label><select id="category"><option>死活</option><option>手筋</option><option>官子</option><option>佈局</option><option>中盤</option><option>其他</option></select></div>
<div class="field"><label>難度</label><select id="level"><option>入門</option><option>級位</option><option>初段～三段</option><option>四段～六段</option><option>高段</option></select></div>
</div>
<div class="toolbar"><button id="black" class="active">● 擺黑棋</button><button id="white">○ 擺白棋</button><button id="erase">⌫ 刪除棋子</button><button id="answer">🔑 設定答案</button><button id="undo">↶ 復原</button><button id="clear" class="danger">清空棋盤</button></div><div class="toolbar"><span class="hint">棋盤標記：</span><button id="seq">🔢 手順</button><button id="tri">△ 三角</button><button id="circleMark">○ 圈</button><button id="cross">× X</button><button id="markA">A</button><button id="markB">B</button><button id="markC">C</button><button id="markD">D</button><button id="eraseMark">⌫ 清除標記</button><button id="clearMarks">清除全部標記</button></div><div id="answerStatus" class="answerHint">目前：建立題目棋形</div>
<svg id="board" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
<div class="hint">操作：選「擺黑棋／擺白棋」後直接點棋盤交叉點。可另外加入手順、△、○、×、A／B／C／D 標記；標記可放在棋子或空交叉點。</div>
<div class="field" style="margin-top:10px"><label>題目／提示（可留白）</label><textarea id="note" placeholder="例如：黑先，請找出活棋的要點。"></textarea></div>
<div class="row"><button id="save" class="primary">💾 儲存題目＋答案</button><button id="new">＋ 新題目</button><button id="clearAnswer">清除答案</button></div>
</section>
<section class="panel">
<h2>② 我的題庫 <span id="count" class="badge">0 題</span> <span id="selectedCount" class="badge">已選 0 題</span></h2>
<div class="hint">勾選題目後，可測試 A4 4／6／10 題排版。</div>
<div class="row"><button id="exportBank" class="primary">💾 儲存題庫檔案</button><button id="importBank">📂 開啟題庫檔案</button><input id="importBankFile" type="file" accept="application/json,.json" style="display:none"><span class="hint">可存到 iPad「檔案」／iCloud Drive，需要時再開啟。</span></div>
<div id="cards" class="cards"></div>
<div class="printbar"><button onclick="doPrint(4,false)">📄 學生 4 題</button><button onclick="doPrint(6,false)" class="primary">📄 學生 6 題</button><button onclick="doPrint(10,false)">📄 學生 10 題</button><button onclick="doPrint(4,true)">🔑 答案 4 題</button><button onclick="doPrint(6,true)">🔑 答案 6 題</button><button onclick="doPrint(10,true)">🔑 答案 10 題</button><button id="all">全選</button><button id="none">取消全選</button><button id="share">↗ 分享學生測驗卷到 LINE</button><button id="shareAnswer">🔑 分享老師答案卷</button></div>
</section>
</main><dialog id="previewDlg"><div class="previewTop"><strong id="previewTitle">題目預覽</strong><button id="closePreview">✕ 關閉</button></div><svg id="previewBoard" viewBox="0 0 1000 1000"></svg><div id="previewMeta" class="hint"></div><div class="previewNav"><button id="prevPreview">← 上一題</button><button id="togglePreview" class="primary">勾選此題</button><button id="nextPreview">下一題 →</button></div></dialog>
<section id="printArea"></section>
<script>
const NS="http://www.w3.org/2000/svg", $=s=>document.querySelector(s), svg=$("#board");
let N=19, stones=[], answers=[], markers=[], mode="B", history=[], puzzles=[];
try{puzzles=JSON.parse(localStorage.getItem("joygo_puzzles_beta01b")||"[]")}catch(e){puzzles=[]}
function el(tag,a={}){let z=document.createElementNS(NS,tag);for(let k in a)z.setAttribute(k,a[k]);return z}
function stars(n){if(n===19)return [[3,3],[9,3],[15,3],[3,9],[9,9],[15,9],[3,15],[9,15],[15,15]];if(n===13)return [[3,3],[9,3],[6,6],[3,9],[9,9]];return [[2,2],[6,2],[4,4],[2,6],[6,6]]}
function buildSvg(target,n,ss,ans=[],marks=[]){
 target.innerHTML=""; target.setAttribute("viewBox","0 0 1000 1000");
 target.appendChild(el("rect",{x:0,y:0,width:1000,height:1000,fill:"#d9aa62"}));
 const p=65,step=870/(n-1);
 let g=el("g",{"stroke":"#3a2b1d","stroke-width":"2","shape-rendering":"geometricPrecision"});
 for(let i=0;i<n;i++){let q=p+i*step;g.appendChild(el("line",{x1:p,y1:q,x2:935,y2:q}));g.appendChild(el("line",{x1:q,y1:p,x2:q,y2:935}))}target.appendChild(g);
 let sg=el("g",{fill:"#2b2119"});stars(n).forEach(([x,y])=>sg.appendChild(el("circle",{cx:p+x*step,cy:p+y*step,r:6})));target.appendChild(sg);
 let cg=el("g");ss.forEach(s=>cg.appendChild(el("circle",{cx:p+s.x*step,cy:p+s.y*step,r:step*.43,fill:s.c==="B"?"#111":"#fff",stroke:"#111","stroke-width":"2"})));target.appendChild(cg);
 if(ans&&ans.length){let ag=el("g");ans.forEach((a,i)=>{let fill=a.c==="B"?"#111":"#fff",txt=a.c==="B"?"#fff":"#111";ag.appendChild(el("circle",{cx:p+a.x*step,cy:p+a.y*step,r:step*.43,fill,stroke:"#b22","stroke-width":"4"}));let t=el("text",{x:p+a.x*step,y:p+a.y*step+step*.13,"text-anchor":"middle","font-size":step*.42,"font-weight":"700",fill:txt});t.textContent=String(a.num??(i+1));ag.appendChild(t)});target.appendChild(ag)}
 if(marks&&marks.length){let mg=el("g");marks.forEach(m=>{let cx=p+m.x*step,cy=p+m.y*step,on=ss.find(s=>s.x===m.x&&s.y===m.y),ink=on&&on.c==="B"?"#fff":"#111",r=step*.25;if(m.type==="tri"){let pts=[[cx,cy-r],[cx-r*.9,cy+r*.7],[cx+r*.9,cy+r*.7]].map(q=>q.join(",")).join(" ");mg.appendChild(el("polygon",{points:pts,fill:"none",stroke:ink,"stroke-width":"5","stroke-linejoin":"round"}))}else if(m.type==="circle"){mg.appendChild(el("circle",{cx,cy,r:r*.9,fill:"none",stroke:ink,"stroke-width":"5"}))}else if(m.type==="cross"){mg.appendChild(el("line",{x1:cx-r,y1:cy-r,x2:cx+r,y2:cy+r,stroke:ink,"stroke-width":"5","stroke-linecap":"round"}));mg.appendChild(el("line",{x1:cx+r,y1:cy-r,x2:cx-r,y2:cy+r,stroke:ink,"stroke-width":"5","stroke-linecap":"round"}))}else{let t=el("text",{x:cx,y:cy+step*.13,"text-anchor":"middle","font-size":step*.42,"font-weight":"800",fill:ink,stroke:on?"none":"#d9aa62","stroke-width":"1"});t.textContent=m.label||m.type;mg.appendChild(t)}});target.appendChild(mg)}
}
function key(x,y){return x+","+y}
function neighborsFor(n,x,y){return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n)}
function groupAt(board,x,y,n=N){const m=new Map(board.map(s=>[key(s.x,s.y),s])),root=m.get(key(x,y));if(!root)return {group:[],libs:new Set()};let stack=[root],seen=new Set([key(x,y)]),group=[],libs=new Set();while(stack.length){let q=stack.pop();group.push(q);for(let [a,b] of neighborsFor(n,q.x,q.y)){let z=m.get(key(a,b));if(!z)libs.add(key(a,b));else if(z.c===root.c&&!seen.has(key(a,b))){seen.add(key(a,b));stack.push(z)}}}return {group,libs}}
function playMove(board,mv,n=N){let b=board.map(s=>({...s}));if(b.some(s=>s.x===mv.x&&s.y===mv.y))return null;b.push({...mv});let enemy=mv.c==="B"?"W":"B";let checked=new Set();for(let [a,b2] of neighborsFor(n,mv.x,mv.y)){let q=b.find(s=>s.x===a&&s.y===b2&&s.c===enemy);if(!q||checked.has(key(a,b2)))continue;let g=groupAt(b,a,b2,n);g.group.forEach(s=>checked.add(key(s.x,s.y)));if(g.libs.size===0){let dead=new Set(g.group.map(s=>key(s.x,s.y)));b=b.filter(s=>!dead.has(key(s.x,s.y)))}}let mine=groupAt(b,mv.x,mv.y,n);if(mine.libs.size===0)return null;return b}
function simulatePosition(base,seq,n=N){let b=base.map(s=>({...s,answerNum:null}));for(let i=0;i<seq.length;i++){let a=seq[i],nb=playMove(b,{x:a.x,y:a.y,c:a.c,answerNum:i+1},n);if(!nb)break;b=nb}return b}
function answerPosition(){return simulatePosition(stones,answers,N)}
function activeAnswerLabels(board){return board.filter(s=>s.answerNum!=null).map(s=>({x:s.x,y:s.y,c:s.c,num:s.answerNum}))}
function draw(){let shown=mode==="ANS"?answerPosition():stones;buildSvg(svg,N,shown,mode==="ANS"?activeAnswerLabels(shown):[],markers);$("#answerStatus").textContent=mode==="ANS"?`🔑 設定答案中：${$("#first").value}・已輸入 ${answers.length} 手（支援自動提子）`:`目前：建立題目棋形${answers.length?`｜已有答案 ${answers.length} 手`:""}`;}
$("#size").onchange=e=>{N=+e.target.value;stones=[];answers=[];markers=[];history=[];draw()}
$("#first").onchange=()=>{if(answers.length){if(confirm("更改先手會清除目前答案手順，確定嗎？")){answers=[];history=[]}else{$("#first").value=$("#first").value==="黑先"?"白先":"黑先"}}draw()}
;const modeButtons=["black","white","erase","answer","seq","tri","circleMark","cross","markA","markB","markC","markD","eraseMark"];
function setMode(m,id){mode=m;modeButtons.forEach(x=>$("#"+x).classList.toggle("active",x===id));draw()}
["black","white","erase"].forEach(id=>$("#"+id).onclick=()=>setMode(id==="black"?"B":id==="white"?"W":"E",id));
$("#answer").onclick=()=>setMode("ANS","answer");
[["seq","SEQ"],["tri","tri"],["circleMark","circle"],["cross","cross"],["markA","MA"],["markB","MB"],["markC","MC"],["markD","MD"],["eraseMark","EM"]].forEach(([id,m])=>$("#"+id).onclick=()=>setMode(m,id));
$("#clearMarks").onclick=()=>{if(markers.length&&confirm("確定清除目前棋盤的全部標記？")){history.push(JSON.stringify({stones,answers,markers}));markers=[];draw()}}
svg.addEventListener("pointerdown",e=>{let r=svg.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*1000,vy=(e.clientY-r.top)/r.height*1000,p=65,step=870/(N-1),x=Math.round((vx-p)/step),y=Math.round((vy-p)/step);if(x<0||y<0||x>=N||y>=N)return;history.push(JSON.stringify({stones,answers,markers}));let k=stones.findIndex(s=>s.x===x&&s.y===y);if(mode==="ANS"){let start=$("#first").value==="黑先"?"B":"W",c=(answers.length%2===0)?start:(start==="B"?"W":"B"),cur=answerPosition();if(cur.some(s=>s.x===x&&s.y===y)){history.pop();return}let nb=playMove(cur,{x,y,c},N);if(!nb){history.pop();alert("這一手不能下（落在已有棋子或形成自殺棋）。");return}answers.push({x,y,c});}else if(["SEQ","tri","circle","cross","MA","MB","MC","MD","EM"].includes(mode)){let mi=markers.findIndex(m=>m.x===x&&m.y===y);if(mode==="EM"){if(mi>=0)markers.splice(mi,1);else history.pop()}else{let mark=mode==="SEQ"?{x,y,type:"seq",label:String(markers.filter(m=>m.type==="seq").length+1)}:{x,y,type:({MA:"A",MB:"B",MC:"C",MD:"D"}[mode]||mode),label:({MA:"A",MB:"B",MC:"C",MD:"D"}[mode])};if(mi>=0)markers[mi]=mark;else markers.push(mark)}}else if(mode==="E"){if(k>=0)stones.splice(k,1)}else if(k<0)stones.push({x,y,c:mode});else stones[k].c=mode;draw()})
$("#undo").onclick=()=>{if(history.length){let h=JSON.parse(history.pop());if(Array.isArray(h)){stones=h}else{stones=h.stones||[];answers=h.answers||[];markers=h.markers||[]}draw()}}
$("#clear").onclick=()=>{if(!stones.length||confirm("確定清空目前棋盤？")){history.push(JSON.stringify({stones,answers,markers}));stones=[];answers=[];markers=[];draw()}}
function reset(){stones=[];answers=[];markers=[];history=[];mode="B";$("#note").value="";modeButtons.forEach(x=>$("#"+x).classList.toggle("active",x==="black"));draw()} $("#new").onclick=reset;$("#clearAnswer").onclick=()=>{answers=[];draw()}
$("#save").onclick=()=>{if(!stones.length)return alert("請先在棋盤上建立題目。");puzzles.push({id:Date.now(),size:N,stones:JSON.parse(JSON.stringify(stones)),first:$("#first").value,category:$("#category").value,level:$("#level").value,note:$("#note").value.trim(),answer:JSON.parse(JSON.stringify(answers)),markers:JSON.parse(JSON.stringify(markers))});try{localStorage.setItem("joygo_puzzles_beta01b",JSON.stringify(puzzles))}catch(e){}const savedAnswerCount=answers.length;render();reset();alert(savedAnswerCount?`題目＋${savedAnswerCount}手答案已儲存。`:"題目已儲存（尚未設定答案）。")}
function esc(s){return (s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function updateSelected(){let n=document.querySelectorAll(".pick:checked").length;$("#selectedCount").textContent="已選 "+n+" 題";document.querySelectorAll(".card").forEach(c=>{let q=c.querySelector(".pick");c.classList.toggle("selected",!!q&&q.checked)})}
function render(){$("#count").textContent=puzzles.length+" 題";let b=$("#cards");b.innerHTML=puzzles.length?"":"<div class='hint' style='padding:25px;text-align:center'>目前還沒有題目。</div>";puzzles.forEach((p,i)=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<svg class="thumb" data-preview="${i}" viewBox="0 0 1000 1000"></svg><input class="pick" type="checkbox" data-id="${p.id}"><div class="info"><strong>第 ${String(i+1).padStart(3,"0")} 題｜${p.category}｜${p.first}</strong><div class="meta">${p.size} 路｜${p.level}｜<span class="answerBadge">${(p.answer||[]).length?"答案 "+p.answer.length+" 手":"未設答案"}</span>${p.note?"｜"+esc(p.note):""}</div></div><button class="danger" data-del="${p.id}">刪除</button>`;b.appendChild(d);buildSvg(d.querySelector(".thumb"),p.size,p.stones,[],p.markers||[])});b.querySelectorAll(".pick").forEach(x=>x.onchange=updateSelected);b.querySelectorAll("[data-preview]").forEach(x=>x.onclick=()=>openPreview(+x.dataset.preview));b.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{if(confirm("確定刪除此題？")){puzzles=puzzles.filter(p=>p.id!=x.dataset.del);try{localStorage.setItem("joygo_puzzles_beta01b",JSON.stringify(puzzles))}catch(e){}render()}});updateSelected()}
let previewIndex=0;
function openPreview(i){previewIndex=i;refreshPreview();$("#previewDlg").showModal()}
function refreshPreview(){if(!puzzles.length)return;let p=puzzles[previewIndex];buildSvg($("#previewBoard"),p.size,p.stones,[],p.markers||[]);$("#previewTitle").textContent=`第 ${String(previewIndex+1).padStart(3,"0")} 題`;$("#previewMeta").textContent=`${p.category}｜${p.first}｜${p.size} 路｜${p.level}${p.note?"｜"+p.note:""}`;let q=document.querySelector(`.pick[data-id="${p.id}"]`);$("#togglePreview").textContent=q&&q.checked?"取消勾選":"勾選此題"}
$("#closePreview").onclick=()=>$("#previewDlg").close();$("#prevPreview").onclick=()=>{previewIndex=(previewIndex-1+puzzles.length)%puzzles.length;refreshPreview()};$("#nextPreview").onclick=()=>{previewIndex=(previewIndex+1)%puzzles.length;refreshPreview()};$("#togglePreview").onclick=()=>{let p=puzzles[previewIndex],q=document.querySelector(`.pick[data-id="${p.id}"]`);if(q){q.checked=!q.checked;updateSelected();refreshPreview()}};
$("#all").onclick=()=>{document.querySelectorAll(".pick").forEach(x=>x.checked=true);updateSelected()};$("#none").onclick=()=>{document.querySelectorAll(".pick").forEach(x=>x.checked=false);updateSelected()};
function openShare(withAnswer=false){
 let ids=[...document.querySelectorAll(".pick:checked")].map(x=>+x.dataset.id),chosen=puzzles.filter(p=>ids.includes(p.id));
 if(!chosen.length)return alert("請先勾選要分享的題目。");if(chosen.length>10)return alert("一次最多分享 10 題。");
 if(withAnswer&&chosen.some(p=>!(p.answer||[]).length)&&!confirm("部分題目尚未設定答案，仍要產生老師答案卷嗎？"))return;
 let n=chosen.length<=4?4:chosen.length<=6?6:10,w=window.open("","_blank");if(!w)return alert("Safari 阻擋了視窗，請允許彈出式視窗後再試一次。");
 let title=withAnswer?"Joy Go 圍棋老師答案卷":"Joy Go 圍棋測驗卷";

function savePuzzlesLocal(){try{localStorage.setItem("joygo_puzzles_beta01b",JSON.stringify(puzzles));return true}catch(e){return false}}
function exportPuzzleBank(){
 const pack={format:"JoyGoPuzzleBank",version:"0.5",exportedAt:new Date().toISOString(),puzzles:puzzles};
 const blob=new Blob([JSON.stringify(pack,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a"),d=new Date(),pad=n=>String(n).padStart(2,"0");
 a.href=url;a.download=`JoyGo題庫_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importPuzzleBank(file){
 try{
  const raw=await file.text(),data=JSON.parse(raw),incoming=Array.isArray(data)?data:data&&Array.isArray(data.puzzles)?data.puzzles:null;
  if(!incoming)throw new Error("格式不符");
  const valid=incoming.every(p=>p&&[9,13,19].includes(+p.size)&&Array.isArray(p.stones)&&Array.isArray(p.answer||[]));
  if(!valid)throw new Error("題庫內容不完整");
  if(puzzles.length&&!confirm(`目前已有 ${puzzles.length} 題。開啟題庫檔案會以檔案中的 ${incoming.length} 題取代目前題庫，確定嗎？`))return;
  puzzles=JSON.parse(JSON.stringify(incoming));savePuzzlesLocal();render();alert(`題庫已開啟，共 ${puzzles.length} 題。`);
 }catch(e){alert("無法開啟這個題庫檔案："+e.message)}
}
$("#exportBank").onclick=()=>{if(!puzzles.length)return alert("目前沒有題目可儲存。");exportPuzzleBank()};
$("#importBank").onclick=()=>$("#importBankFile").click();
$("#importBankFile").onchange=e=>{let f=e.target.files&&e.target.files[0];if(f)importPuzzleBank(f);e.target.value=""};
window.doPrint=(num,withAnswer=false)=>{let ids=[...document.querySelectorAll(".pick:checked")].map(x=>+x.dataset.id),ch=puzzles.filter(p=>ids.includes(p.id)).slice(0,num);if(!ch.length)return alert("請先勾選題目。");if(withAnswer&&ch.some(p=>!(p.answer||[]).length)&&!confirm("部分題目尚未設定答案，仍要列印嗎？"))return;let a=$("#printArea"),title=withAnswer?"Joy Go 圍棋老師答案卷":"Joy Go 圍棋測驗卷";a.innerHTML=`<div class="sheet-title">${title}</div><div class="sheet-sub"><span>${ch.length} 題${withAnswer?"答案":"練習"}</span><span>${withAnswer?"老師用":"姓名：____________　日期：____________"}</span></div><div class="print-grid n${num}"></div>`;let grid=a.querySelector(".print-grid");ch.forEach((p,i)=>{let d=document.createElement("div");d.className="puzzle";d.innerHTML=`<div class="phead">第 ${i+1} 題　${p.first}　${p.category}${withAnswer&&!(p.answer||[]).length?"　（未設答案）":""}</div><svg class="psvg" viewBox="0 0 1000 1000"></svg>`;grid.appendChild(d);if(withAnswer){let pos=simulatePosition(p.stones,p.answer||[],p.size);buildSvg(d.querySelector("svg"),p.size,pos,activeAnswerLabels(pos),p.markers||[])}else{buildSvg(d.querySelector("svg"),p.size,p.stones,[],p.markers||[])}});setTimeout(()=>window.print(),100)}
draw();
